name = sapi5Organizer
summary = "SAPI5 Organizer"
description = """Organises every SAPI5 speech engine, language and voice on your system, and adds three cascading combo boxes to NVDA's Speech settings.

WHAT IT DOES
SAPI5 Organizer scans your computer for every installed SAPI5 text to speech engine and indexes all of the voices and languages each engine provides. Both the 32 bit and the 64 bit registry views are scanned, along with the classic SAPI5, the Windows OneCore and the Microsoft Speech Platform voice categories, in both HKEY_LOCAL_MACHINE and HKEY_CURRENT_USER, so the catalogue is complete no matter how the engines on a particular machine were installed.

SAPI5 publishes voices in two different ways, and both are covered. Some voices have a registry key of their own. Others are produced at run time by a token enumerator, a COM object registered under TokenEnums that invents its voices when SAPI asks for them; those voices have no registry keys at all, and on a well stocked machine they can easily outnumber the ones that do. Every voice is attributed to the engine that actually provides it, so there is no catch-all "other" group.

THREE NEW COMBO BOXES
Whenever the "Microsoft Speech API version 5 (32 bit)" or "Microsoft Speech API version 5 (64 bit)" synthesizer is selected, three extra combo boxes appear in NVDA's Speech settings category: SAPI engine, SAPI language and SAPI voice variant. They cascade: choosing an engine narrows the language list to the languages that engine actually provides, and choosing a language narrows the voice variant list to the voices of that engine in that language. This turns a single flat list of hundreds of voices into a few short, meaningful ones. If any other synthesizer is selected, the combo boxes do not appear and NVDA behaves exactly as it normally does.

SAVING YOUR SETTINGS
The three settings are ordinary NVDA driver settings, so they are written to your configuration when you press OK or Apply, they are stored permanently when you save the configuration with NVDA+control+c, and they are remembered separately in each NVDA configuration profile.

THE VOICE INDEX
A "SAPI5 voice index" item in NVDA's Tools menu shows the whole catalogue: every voice, the engine that provides it, its language, whether that engine is registered for 32 bit programs, 64 bit programs or both, and the registry key the voice comes from. The list can be filtered, copied to the clipboard, saved to a text file or written to the NVDA log. Engines whose COM server is missing are reported as "not registered", which is usually the explanation when a voice appears in a list but refuses to speak.

The add-on writes detailed diagnostic information to the NVDA log throughout, so problems on any particular machine can be traced."""
